<h1>Products</h1>

<p class="status">{{ status() }}</p>

<section>
  <button type="button" (click)="getToken()">Get token</button>
  <button type="button" (click)="loadProducts()">Refresh list</button>
</section>

<section>
  <h2>List</h2>
  <div class="field">
    <label for="colour">Colour filter</label>
    <input id="colour" name="colour" [(ngModel)]="colourFilter" placeholder="e.g. Red (optional)" />
  </div>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Color</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      @for (p of products(); track p.id) {
        <tr>
          <td>{{ p.name }}</td>
          <td>{{ p.color }}</td>
          <td>{{ p.price }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3">No products yet.</td>
        </tr>
      }
    </tbody>
  </table>
</section>

<section>
  <h2>Add product</h2>
  <div class="field">
    <label for="name">Name</label>
    <input id="name" name="name" [(ngModel)]="name" />
  </div>
  <div class="field">
    <label for="color">Color</label>
    <input id="color" name="color" [(ngModel)]="color" />
  </div>
  <div class="field">
    <label for="price">Price</label>
    <input id="price" name="price" type="number" step="0.01" [(ngModel)]="price" />
  </div>
  <button type="button" (click)="addProduct()">Create</button>
</section>
